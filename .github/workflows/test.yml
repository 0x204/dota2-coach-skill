name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          # The oldest Node version the README supports.
          - os: ubuntu-latest
            node: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Node 22 expands the globs itself, so the command is the same in PowerShell.
      - run: node --test test/runtime/*.test.mjs dota2-match-coach/scripts/test/*.test.mjs
